<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A veterinarian listens to a dog's heartbeat with a stethoscope">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcf3ee"/>
      <stop offset="1" stop-color="#b4ded5"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd5cb"/>
      <stop offset="1" stop-color="#84c4b8"/>
    </linearGradient>
  </defs>

  <!-- clinic room -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <circle cx="1250" cy="250" r="340" fill="#ffffff" opacity=".35"/>
  <circle cx="1500" cy="780" r="260" fill="#7fc8bb" opacity=".35"/>
  <circle cx="700" cy="110" r="150" fill="#ffffff" opacity=".25"/>

  <!-- window -->
  <rect x="990" y="90" width="380" height="290" rx="30" fill="#f1fbf9" stroke="#ffffff" stroke-width="16"/>
  <path d="M1180 98v274M998 235h364" stroke="#ffffff" stroke-width="12"/>
  <circle cx="1090" cy="170" r="34" fill="#fde9a8"/>

  <!-- medical cross on the wall -->
  <g fill="#ffffff" opacity=".95">
    <rect x="1440" y="120" width="44" height="130" rx="14"/>
    <rect x="1397" y="163" width="130" height="44" rx="14"/>
  </g>

  <!-- shelf with jars -->
  <rect x="140" y="250" width="420" height="16" rx="8" fill="#ffffff"/>
  <rect x="180" y="190" width="56" height="60" rx="12" fill="#6fb8aa"/>
  <rect x="256" y="170" width="56" height="80" rx="12" fill="#f4b9a4"/>
  <rect x="332" y="200" width="56" height="50" rx="12" fill="#fde9a8"/>

  <!-- floor -->
  <rect y="730" width="1600" height="170" fill="url(#floor)"/>
  <ellipse cx="1180" cy="790" rx="430" ry="32" fill="#2f6f66" opacity=".22"/>
  <ellipse cx="760" cy="800" rx="150" ry="22" fill="#2f6f66" opacity=".22"/>

  <!-- examination table -->
  <rect x="940" y="640" width="26" height="150" rx="10" fill="#d6e5e2"/>
  <rect x="1394" y="640" width="26" height="150" rx="10" fill="#d6e5e2"/>
  <rect x="880" y="600" width="600" height="52" rx="26" fill="#ffffff"/>
  <rect x="880" y="636" width="600" height="16" rx="8" fill="#cfe3df"/>

  <!-- dog -->
  <path d="M1352 500c46-26 96-4 90 42-3 22-24 36-44 28" fill="none" stroke="#c98a3d" stroke-width="30" stroke-linecap="round"/>
  <ellipse cx="1240" cy="520" rx="165" ry="95" fill="#e0a35a"/>
  <ellipse cx="1340" cy="562" rx="78" ry="56" fill="#c98a3d"/>
  <rect x="1150" y="540" width="50" height="62" rx="25" fill="#e0a35a"/>
  <rect x="1226" y="548" width="50" height="54" rx="25" fill="#d49a4c"/>
  <ellipse cx="1112" cy="458" rx="60" ry="74" fill="#e8b26c"/>
  <circle cx="1096" cy="400" r="88" fill="#e8b26c"/>
  <ellipse cx="1030" cy="372" rx="36" ry="76" transform="rotate(14 1030 372)" fill="#b9772f"/>
  <ellipse cx="1160" cy="360" rx="34" ry="70" transform="rotate(-18 1160 360)" fill="#b9772f"/>
  <ellipse cx="1052" cy="430" rx="50" ry="38" fill="#f4d7ab"/>
  <circle cx="1014" cy="418" r="15" fill="#2a2f2e"/>
  <circle cx="1082" cy="380" r="10" fill="#2a2f2e"/>
  <circle cx="1128" cy="378" r="10" fill="#2a2f2e"/>
  <circle cx="1085" cy="376" r="3" fill="#ffffff"/>
  <circle cx="1131" cy="374" r="3" fill="#ffffff"/>
  <path d="M1030 446q22 22 46 0" fill="none" stroke="#2a2f2e" stroke-width="5" stroke-linecap="round"/>
  <path d="M1034 470q26 24 60 4" fill="#f08f98" opacity=".0"/>
  <rect x="1020" y="470" width="150" height="22" rx="11" fill="#d1432b"/>
  <circle cx="1096" cy="506" r="14" fill="#f3b73a"/>

  <!-- veterinarian -->
  <rect x="700" y="430" width="210" height="330" rx="80" fill="#ffffff"/>
  <path d="M770 430l30 70 34-70z" fill="#2c8f80"/>
  <path d="M800 500v250" stroke="#d9e8e5" stroke-width="6"/>
  <rect x="712" y="560" width="64" height="56" rx="14" fill="#eef6f4"/>
  <circle cx="800" cy="350" r="68" fill="#f1c7a0"/>
  <path d="M728 342c-10-70 40-96 90-92 52 4 66 48 54 92-18-34-44-46-84-44-24 2-46 14-60 44z" fill="#4b3326"/>
  <circle cx="780" cy="356" r="7" fill="#2a2f2e"/>
  <circle cx="828" cy="356" r="7" fill="#2a2f2e"/>
  <path d="M780 384q20 20 44 0" fill="none" stroke="#2a2f2e" stroke-width="5" stroke-linecap="round"/>
  <!-- stethoscope -->
  <path d="M768 440c-26 60 6 110 44 98c28-9 34-44 20-70" fill="none" stroke="#33524d" stroke-width="9" stroke-linecap="round"/>
  <!-- arm + hand with stethoscope chest piece -->
  <path d="M880 480c90 30 170 70 262 48" fill="none" stroke="#ffffff" stroke-width="62" stroke-linecap="round"/>
  <circle cx="1146" cy="526" r="32" fill="#f1c7a0"/>
  <circle cx="1164" cy="538" r="22" fill="#c3d2cf" stroke="#33524d" stroke-width="7"/>
  <path d="M832 468c130 70 214 92 312 70" fill="none" stroke="#33524d" stroke-width="7" stroke-linecap="round" opacity=".0"/>

  <!-- paw prints -->
  <g fill="#ffffff" opacity=".55">
    <circle cx="300" cy="640" r="18"/><circle cx="338" cy="620" r="14"/><circle cx="372" cy="640" r="14"/><circle cx="318" cy="676" r="22"/>
    <circle cx="520" cy="560" r="14"/><circle cx="552" cy="544" r="11"/><circle cx="580" cy="560" r="11"/><circle cx="538" cy="590" r="17"/>
  </g>
</svg>
